<text x="60" y="944">说明 1　pin1(3V3) 为模组内部 LDO 输出（≤10mA），仅接 C7 去耦；切勿与板上 +3.3V 轨相连。</text>
<text x="60" y="964">说明 2　UART1：pin4 PA3(RX1) → 网络 UART1_TX → ESP32 GPIO18；pin5 PA2(TX1) → UART1_RX → ESP32 GPIO19；115200 8N1。</text>
<text x="60" y="984">说明 3　烧录：pin16 PB5(TX0) / pin15 PB6(RX0) → J4；下载时需冷启动（取下 JP1 断电再插回）。</text>
<text x="60" y="1004">说明 4　pin13 PA4/PG_EN：上电高电平启动编程，默认上拉，勿硬接地。pin12 MUTE：8002A 使能（低有效），内部默认使能，常规可悬空。</text>
<text x="60" y="1024">说明 5　SPKL+/SPKL- 为 BTL 功放输出，直接驱动 8Ω 喇叭、无需隔直电容；走线短而粗，区域不得被其它走线跨越。</text>
<text x="60" y="1044">说明 6　MIC 偏置 R6 与耦合/去耦 C11、C14（各1只）取值须按所选驻极体麦克风规格确认。NC：pin2/3/6/7/14 预留。</text>
